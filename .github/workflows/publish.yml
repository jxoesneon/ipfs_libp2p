name: Publish to pub.dev

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (do not actually publish)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ipfs_libp2p
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check if version already published
        id: version-check
        run: |
          NAME=$(awk '/^name:/{print $2; exit}' pubspec.yaml)
          VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          if curl -sf "https://pub.dev/api/packages/${NAME}" | jq -e --arg v "$VERSION" '.versions[] | select(.version == $v)' > /dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME} ${VERSION} is already on pub.dev — publish steps will be skipped"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-warnings

      - name: Run tests
        run: dart test --reporter=expanded

      - name: Clean working tree before publish
        run: git checkout -- .

      - name: Publish - dry run
        if: steps.version-check.outputs.already_published != 'true'
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        if: inputs.dry_run != true && steps.version-check.outputs.already_published != 'true'
        run: dart pub publish -f
