name: ipfs_libp2p
description: A comprehensive Dart implementation of the libp2p networking stack with modular architecture, multiple transports (TCP/UDX), Noise security, and peer-to-peer capabilities.
version: 0.6.0
repository: https://github.com/jxoesneon/ipfs_libp2p
issue_tracker: https://github.com/jxoesneon/ipfs_libp2p/issues

environment:
  sdk: "^3.13.0"

dependencies:
  protobuf: ^6.1.0
  x25519: ^0.1.2
  cryptography: ^2.9.0
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  fixnum: ^1.1.1
  uuid: ^4.6.0
  synchronized: ^3.5.0
  bs58: ^1.0.2
  dart_multihash: ^1.0.1
  base32: ^2.2.0
  mdns_dart: ^2.2.2

  base_x: ^2.0.1

  dart_udx: ^2.0.3

  dcid: ^1.0.0

  async: ^2.13.1
  meta: ^1.19.0
  collection: ^1.19.1
  logging: ^1.3.0
  convert: ^3.1.2
  args: ^2.7.0
  buffer: ^1.2.3
  stack_trace: ^1.12.2

dev_dependencies:
  mockito: ^5.8.1
  build_runner: ^2.16.2
  protoc_builder: ^0.6.1
  test: ^1.33.0
  protoc_plugin: ^25.0.0
  lints: ^6.1.0
